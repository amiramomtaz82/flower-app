workflows:
  android-release:
    name: Android Release (Firebase App Distribution)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_keystore
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.example.flower_app"
        FIREBASE_ANDROID_APP_ID: "1:418086415678:android:b05de01a7f457b44c6506f"
      flutter: 3.44.8
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true
        - pattern: 'dev'
          include: true
          source: true
        - pattern: 'feature/ci-cd'
          include: true
          source: true
    scripts:
      - name: Create .env placeholder
        script: |
          echo "BASE_URL=http://localhost:8080" > .env
      - name: Set up Android keystore and signing config
        script: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            CLEAN_BASE64=$(echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ')
            echo "$CLEAN_BASE64" | base64 -D > android/app/upload-keystore.jks 2>/dev/null || \
            echo "$CLEAN_BASE64" | base64 -d > android/app/upload-keystore.jks 2>/dev/null || \
            echo "$CLEAN_BASE64" | base64 --decode > android/app/upload-keystore.jks

            cp android/app/upload-keystore.jks android/upload-keystore.jks

            # For PKCS12 keystores, storePassword and keyPassword are always identical.
            KEYSTORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-flowerApp123}"
            KEY_PASS="${KEYSTORE_PASS}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-upload}"

            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties

            echo "Keystore and key.properties configured successfully."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set, falling back to debug signing."
          fi
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Run code generation (build_runner)
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Run Flutter analyzer and tests
        script: |
          dart analyze --no-fatal-warnings
          flutter test
      - name: Build Android Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: 1:418086415678:android:b05de01a7f457b44c6506f
          groups:
            - testers

  ios-release:
    name: iOS Release Workflow
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "com.example.flowerApp"
      flutter: 3.44.8
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true
        - pattern: 'dev'
          include: true
          source: true
        - pattern: 'feature/ci-cd'
          include: true
          source: true
    scripts:
      - name: Create .env placeholder
        script: |
          echo "BASE_URL=http://localhost:8080" > .env
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Run code generation (build_runner)
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
