name: Deploy to Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'Manual release build from GitHub Actions'
      tester_groups:
        description: 'Tester group(s) in Firebase (comma-separated)'
        required: false
        default: 'testers'
  push:
    branches:
      - feature/ci-cd
    tags:
      - 'v*'

jobs:
  deploy-android:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Create .env placeholder for assets
        run: |
          touch .env
          echo "BASE_URL=http://localhost:8080" > .env

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run code generation (build_runner)
        run: dart run build_runner build

      - name: Configure Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -di > android/app/upload-keystore.jks
          cp android/app/upload-keystore.jks android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          chmod +x android/gradlew

      - name: Configure Firebase Service Account Credentials
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_CREDENTIALS" > android/firebase_credentials.json

      - name: Build Android Release APK with Flutter
        run: flutter build apk --release

      - name: Verify APK was generated
        run: ls -la ${{ github.workspace }}/build/app/outputs/flutter-apk/

      - name: Run Fastlane to Deploy to Firebase
        working-directory: android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_CREDENTIALS_PATH: ${{ github.workspace }}/android/firebase_credentials.json
          FIREBASE_TESTER_GROUPS: ${{ github.event.inputs.tester_groups || 'testers' }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || github.event.head_commit.message || 'Automated release build from GitHub Actions' }}
          APK_PATH: ${{ github.workspace }}/build/app/outputs/flutter-apk/app-release.apk
        run: bundle exec fastlane android distribute_firebase

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore

      - name: Clean sensitive credentials
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/upload-keystore.jks
          rm -f android/key.properties
          rm -f android/firebase_credentials.json
          rm -f .env
