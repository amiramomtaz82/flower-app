name: Shorebird Code Push (OTA)

on:
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - patch
          - release
        default: 'patch'
      release_version:
        description: 'Target release version for patch (leave empty to auto-detect from pubspec.yaml)'
        required: false
        default: ''
      allow_native_diffs:
        description: 'Allow native diffs when patching (dangerous if native code changed)'
        required: false
        type: boolean
        default: false

jobs:
  shorebird:
    name: Shorebird ${{ github.event.inputs.action_type || 'Patch' }} (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/shorebird-action@v0
        with:
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Create .env placeholder for assets
        run: |
          touch .env
          echo "BASE_URL=http://localhost:8080" > .env

      - name: Install dependencies
        run: shorebird flutter pub get

      - name: Run code generation (build_runner)
        run: dart run build_runner build

      - name: Configure Android Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -di > android/app/upload-keystore.jks
          cp android/app/upload-keystore.jks android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" "$KEY_ALIAS" > android/key.properties
          chmod +x android/gradlew

      - name: Run Shorebird Release
        if: ${{ github.event.inputs.action_type == 'release' }}
        run: |
          shorebird release android --force

      - name: Run Shorebird Patch
        if: ${{ github.event.inputs.action_type != 'release' }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.release_version }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --release-version=${{ github.event.inputs.release_version }}"
          fi
          if [ "${{ github.event.inputs.allow_native_diffs }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --allow-native-diffs"
          fi
          shorebird patch android --force $EXTRA_ARGS

      - name: Clean sensitive credentials
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/upload-keystore.jks
          rm -f android/key.properties
