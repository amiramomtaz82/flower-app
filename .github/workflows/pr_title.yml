name: "PR Title Validation"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    name: "Validate PR Title"
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Title Semantic Conventions
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Supported types based on Conventional Commits standard
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "The subject must not start with an uppercase character (e.g. use 'feat: add login' instead of 'feat: Add login')."
